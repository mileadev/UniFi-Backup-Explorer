        const BSON_PAGE_SIZE = 50;
        const UNGROUPED_COLLECTION = '(documents)';

        function getBsonApi() {
            if (typeof BSON === 'undefined') return null;
            // bson.bundle exposes either BSON.deserialize or BSON.BSON.deserialize
            if (typeof BSON.deserialize === 'function') return BSON;
            if (BSON.BSON && typeof BSON.BSON.deserialize === 'function') return BSON.BSON;
            return null;
        }

        function readBsonDocSize(bytes, offset) {
            return (bytes[offset] |
                (bytes[offset + 1] << 8) |
                (bytes[offset + 2] << 16) |
                (bytes[offset + 3] << 24)) >>> 0;
        }

        function looksLikeBson(bytes) {
            if (!bytes || bytes.length < 5) return false;
            const size = readBsonDocSize(bytes, 0);
            return size >= 5 && size <= bytes.length && bytes[size - 1] === 0;
        }

        function isDbLikeFileName(fileName) {
            const base = (fileName.split('/').pop() || fileName)
                .replace(/\s*\(decompressed\)\s*$/i, '')
                .toLowerCase();
            return base.endsWith('.bson') ||
                base === 'db' ||
                base === 'db.gz' ||
                /^db[_(-]/.test(base) ||
                base.includes('db.gz');
        }

        function getSelectCollection(doc) {
            if (!doc || typeof doc !== 'object') return null;
            const cmd = doc.__cmd ?? doc.cmd;
            if (cmd === 'select' && typeof doc.collection === 'string' && doc.collection) {
                return doc.collection;
            }
            return null;
        }

        function parseBsonDump(bytes) {
            const api = getBsonApi();
            if (!api) throw new Error('BSON library not loaded');

            const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
            const documents = [];
            let offset = 0;

            while (offset + 4 <= data.length) {
                const docSize = readBsonDocSize(data, offset);
                if (docSize < 5 || offset + docSize > data.length) break;
                if (data[offset + docSize - 1] !== 0) break;

                const docBytes = data.subarray(offset, offset + docSize);
                documents.push(api.deserialize(docBytes));
                offset += docSize;
            }

            if (documents.length === 0) {
                throw new Error('No BSON documents parsed');
            }

            const collections = Object.create(null);
            const order = [];
            let current = UNGROUPED_COLLECTION;
            let usedSelectCommands = false;

            const ensureCollection = (name) => {
                if (!collections[name]) {
                    collections[name] = [];
                    order.push(name);
                }
            };

            for (const doc of documents) {
                const selected = getSelectCollection(doc);
                if (selected) {
                    usedSelectCommands = true;
                    current = selected;
                    ensureCollection(current);
                    continue;
                }
                ensureCollection(current);
                collections[current].push(doc);
            }

            if (usedSelectCommands && collections[UNGROUPED_COLLECTION] && collections[UNGROUPED_COLLECTION].length === 0) {
                delete collections[UNGROUPED_COLLECTION];
                const idx = order.indexOf(UNGROUPED_COLLECTION);
                if (idx >= 0) order.splice(idx, 1);
            }

            return {
                documents,
                collections,
                order: order.filter((name) => collections[name]),
                totalDocs: documents.length,
                bytesParsed: offset,
                bytesTotal: data.length
            };
        }

        function stringifyBsonValue(value) {
            const api = getBsonApi();
            try {
                if (api && api.EJSON && typeof api.EJSON.stringify === 'function') {
                    return api.EJSON.stringify(value, null, 2);
                }
            } catch (e) {
                // Fall through to JSON
            }
            return JSON.stringify(value, null, 2);
        }

        function showBsonBrowser(fileName, dump) {
            const collectionNames = dump.order.length
                ? dump.order
                : Object.keys(dump.collections);
            if (collectionNames.length === 0) return false;

            let activeCollection = collectionNames[0];
            let page = 0;

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';

            const metaParts = [
                `${collectionNames.length} collection${collectionNames.length === 1 ? '' : 's'}`,
                `${dump.totalDocs} document${dump.totalDocs === 1 ? '' : 's'}`
            ];
            if (dump.bytesParsed < dump.bytesTotal) {
                metaParts.push(`parsed ${dump.bytesParsed}/${dump.bytesTotal} bytes`);
            }

            modal.innerHTML = `
                <div class="modal-panel modal-panel-wide">
                    <h2>${escapeHtml(fileName)} <span class="modal-meta">(BSON database — ${escapeHtml(metaParts.join(' · '))})</span></h2>
                    <div class="bson-browser">
                        <div class="bson-sidebar">
                            <input type="search" class="bson-filter" placeholder="Filter collections…" aria-label="Filter collections">
                            <ul class="bson-collections"></ul>
                        </div>
                        <div class="bson-main">
                            <div class="bson-toolbar">
                                <div class="bson-status"></div>
                                <div class="bson-actions">
                                    <button type="button" class="bson-prev">Previous</button>
                                    <button type="button" class="bson-next">Next</button>
                                    <button type="button" class="bson-copy">Copy JSON</button>
                                </div>
                            </div>
                            <div class="json-viewer"><pre></pre></div>
                        </div>
                    </div>
                    <button class="reset-btn" type="button">Close</button>
                </div>
            `;

            const filterInput = modal.querySelector('.bson-filter');
            const listEl = modal.querySelector('.bson-collections');
            const statusEl = modal.querySelector('.bson-status');
            const preEl = modal.querySelector('.json-viewer pre');
            const prevBtn = modal.querySelector('.bson-prev');
            const nextBtn = modal.querySelector('.bson-next');
            const copyBtn = modal.querySelector('.bson-copy');
            const closeBtn = modal.querySelector('.reset-btn');

            const getDocs = () => dump.collections[activeCollection] || [];

            const renderList = () => {
                const query = (filterInput.value || '').trim().toLowerCase();
                listEl.innerHTML = '';
                collectionNames.forEach((name) => {
                    if (query && !name.toLowerCase().includes(query)) return;
                    const count = (dump.collections[name] || []).length;
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = name === activeCollection ? 'active' : '';
                    btn.innerHTML = `<span class="coll-name">${escapeHtml(name)}</span><span class="coll-count">${count}</span>`;
                    btn.addEventListener('click', () => {
                        activeCollection = name;
                        page = 0;
                        renderList();
                        renderDocs();
                    });
                    li.appendChild(btn);
                    listEl.appendChild(li);
                });
            };

            const renderDocs = () => {
                const docs = getDocs();
                const totalPages = Math.max(1, Math.ceil(docs.length / BSON_PAGE_SIZE) || 1);
                if (page >= totalPages) page = totalPages - 1;
                if (page < 0) page = 0;

                const start = page * BSON_PAGE_SIZE;
                const slice = docs.slice(start, start + BSON_PAGE_SIZE);
                const jsonText = stringifyBsonValue(slice);
                const preview = jsonText.length > 200000
                    ? jsonText.slice(0, 200000) + '\n\n/* Preview truncated */'
                    : jsonText;

                preEl.innerHTML = highlightJson(preview);
                const end = Math.min(docs.length, start + slice.length);
                statusEl.textContent = docs.length === 0
                    ? `${activeCollection}: no documents`
                    : `${activeCollection}: showing ${start + 1}–${end} of ${docs.length}`;
                prevBtn.disabled = page <= 0;
                nextBtn.disabled = end >= docs.length;
            };

            filterInput.addEventListener('input', renderList);
            prevBtn.addEventListener('click', () => {
                page -= 1;
                renderDocs();
            });
            nextBtn.addEventListener('click', () => {
                page += 1;
                renderDocs();
            });
            copyBtn.addEventListener('click', async () => {
                const text = stringifyBsonValue(getDocs());
                try {
                    await navigator.clipboard.writeText(text);
                    copyBtn.textContent = 'Copied';
                    setTimeout(() => { copyBtn.textContent = 'Copy JSON'; }, 1200);
                } catch (e) {
                    copyBtn.textContent = 'Copy failed';
                    setTimeout(() => { copyBtn.textContent = 'Copy JSON'; }, 1200);
                }
            });

            const close = () => {
                modal.remove();
                document.removeEventListener('keydown', onKeydown);
            };
            const onKeydown = (e) => {
                if (e.key === 'Escape') close();
            };
            closeBtn.addEventListener('click', close);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) close();
            });

            document.addEventListener('keydown', onKeydown);
            document.body.appendChild(modal);
            renderList();
            renderDocs();
            if (filterInput) filterInput.focus();
            return true;
        }

        function tryShowBsonContent(fileName, bytes) {
            try {
                const dump = parseBsonDump(bytes);
                return showBsonBrowser(fileName, dump);
            } catch (e) {
                console.warn('BSON parse failed for', fileName, ':', e.message);
                return false;
            }
        }
        
        function generateHexDump(data, maxLines = 50) {
            let hex = '';
            const bytesPerLine = 16;
            const maxBytes = maxLines * bytesPerLine;
            const displayData = data.length > maxBytes ? data.slice(0, maxBytes) : data;
            
            for (let i = 0; i < displayData.length; i += bytesPerLine) {
                const offset = i.toString(16).padStart(8, '0').toUpperCase();
                const chunk = displayData.slice(i, i + bytesPerLine);
                
                // Hex representation
                let hexPart = '';
                let asciiPart = '';
                for (let j = 0; j < bytesPerLine; j++) {
                    if (j + i < displayData.length) {
                        const byte = chunk[j];
                        hexPart += byte.toString(16).padStart(2, '0').toUpperCase() + ' ';
                        // ASCII representation
                        asciiPart += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                    } else {
                        hexPart += '   ';
                        asciiPart += ' ';
                    }
                    // Add extra space in the middle for readability
                    if (j === 7) hexPart += ' ';
                }
                
                hex += `${offset}  ${hexPart.padEnd(50)} ${asciiPart}\n`;
            }
            
            if (displayData.length < data.length) {
                hex += `\n[Showing first ${displayData.length} bytes of ${data.length} total bytes]`;
            }
            
            return hex;
        }

        function showFileContent(fileName) {
            const file = window.backupFiles.find(f => f.name === fileName);
            if (!file) return;
            
            let content;
            let isText = false;
            let displayType = 'text';
            const fileBytes = file.data instanceof Uint8Array ? file.data : new Uint8Array(file.data);
            
            // Check for actual gzip magic bytes
            const hasGzipMagicBytes = fileBytes.length >= 2 && fileBytes[0] === 0x1f && fileBytes[1] === 0x8b;
            
            if (hasGzipMagicBytes && typeof pako !== 'undefined') {
                try {
                    const decompressed = pako.inflate(fileBytes);

                    if (tryShowBsonContent(fileName, decompressed)) {
                        return;
                    }

                    // Prefer BSON-style messaging when the payload looks binary / UniFi dump-like
                    const sample = new TextDecoder().decode(decompressed.slice(0, Math.min(200, decompressed.length)));
                    const looksBinary = Array.from(decompressed.slice(0, 20)).some(b => b < 0x20 && b !== 0x0a && b !== 0x0d && b !== 0x09);
                    if (sample.includes('selectcollection') || looksLikeBson(decompressed) || looksBinary) {
                        content = `BSON Database File (Binary - ${decompressed.length} bytes)\n\n` +
                                 `Could not parse MongoDB BSON documents in the browser.\n\n` +
                                 `Preview of raw data:\n` +
                                 generateHexDump(decompressed.slice(0, 512));
                        displayType = 'bson';
                        isText = true;
                    } else {
                        content = new TextDecoder().decode(decompressed);
                        isText = true;
                        displayType = 'gzip-text';
                    }
                } catch (e) {
                    // If gzip decompression fails, show hex dump
                    console.warn('Failed to decompress gzip file:', e);
                    content = generateHexDump(fileBytes);
                    displayType = 'hex';
                }
            } else if (file.name.endsWith('.gz')) {
                // .gz file without gzip magic bytes - likely stored raw
                if (tryShowBsonContent(fileName, fileBytes)) {
                    return;
                }
                try {
                    content = new TextDecoder().decode(fileBytes);
                    if (content.includes('\n') || content.match(/^[\w\s\-\.,:{}[\]"']+$/) || file.name.endsWith('.properties')) {
                        isText = true;
                        displayType = 'text';
                    } else {
                        // Binary data with .gz extension
                        content = generateHexDump(fileBytes);
                        displayType = 'hex';
                    }
                } catch (e) {
                    // Binary file
                    content = generateHexDump(fileBytes);
                    displayType = 'hex';
                }
            } else if (isDbLikeFileName(fileName) || fileName.toLowerCase().endsWith('.bson') || looksLikeBson(fileBytes)) {
                if (tryShowBsonContent(fileName, fileBytes)) {
                    return;
                }
                content = `BSON Database File (Binary - ${fileBytes.length} bytes)\n\n` +
                         `Could not parse MongoDB BSON documents in the browser.\n\n` +
                         `Preview of raw data:\n` +
                         generateHexDump(fileBytes.slice(0, 512));
                displayType = 'bson';
                isText = true;
            } else {
                try {
                    content = new TextDecoder().decode(fileBytes);
                    // Check if it looks like text
                    if (content.includes('\n') || content.match(/^[\w\s\-\.,:{}[\]"']+$/) || file.name.endsWith('.json') || file.name.endsWith('.properties') || file.name.endsWith('.txt')) {
                        isText = true;
                        displayType = 'text';
                    }
                } catch (e) {
                    // Binary file
                }
                
                if (!isText) {
                    if (file.name.endsWith('.png') || file.name.endsWith('.jpg')) {
                        // Try to create image data URL
                        const blob = new Blob([fileBytes], { type: file.name.endsWith('.png') ? 'image/png' : 'image/jpeg' });
                        const url = URL.createObjectURL(blob);
                        const modal = document.createElement('div');
                        modal.className = 'modal-overlay';
                        modal.innerHTML = `
                            <div class="modal-panel" style="text-align: center;">
                                <h2>${escapeHtml(fileName)}</h2>
                                <img src="${url}" alt="${escapeHtml(fileName)}">
                                <button class="reset-btn" type="button">Close</button>
                            </div>
                        `;
                        const closeImageModal = () => {
                            modal.remove();
                            URL.revokeObjectURL(url);
                            document.removeEventListener('keydown', onImageKeydown);
                        };
                        const onImageKeydown = (e) => {
                            if (e.key === 'Escape') closeImageModal();
                        };
                        modal.querySelector('.reset-btn').addEventListener('click', closeImageModal);
                        modal.addEventListener('click', (e) => {
                            if (e.target === modal) closeImageModal();
                        });
                        document.addEventListener('keydown', onImageKeydown);
                        document.body.appendChild(modal);
                        return;
                    } else {
                        // Show hex dump for unknown binary files
                        content = generateHexDump(fileBytes);
                        displayType = 'hex';
                    }
                }
            }
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            
            let typeLabel = '';
            if (displayType === 'gzip-text') typeLabel = 'decompressed from .gz';
            else if (displayType === 'bson-json') typeLabel = 'BSON converted to JSON';
            else if (displayType === 'bson') typeLabel = 'BSON database file';
            else if (displayType === 'hex') typeLabel = 'hex dump — binary file';

            const previewText = formatJsonPreview(isText ? content.substring(0, 100000) : content, file.name, displayType);
            const renderedContent = renderHighlightedPreview(previewText, file.name, displayType);
            const metaHtml = typeLabel ? ` <span class="modal-meta">(${typeLabel})</span>` : '';
            
            modal.innerHTML = `
                <div class="modal-panel">
                    <h2>${escapeHtml(fileName)}${metaHtml}</h2>
                    <div class="json-viewer"><pre>${renderedContent}</pre></div>
                    <div class="modal-actions">
                        <button class="reset-btn btn-secondary" type="button" data-action="download">${ICON_DOWNLOAD}Download File</button>
                        <button class="reset-btn" type="button" data-action="close">Close</button>
                    </div>
                </div>
            `;

            const previouslyFocused = document.activeElement;
            const closePreview = () => {
                modal.remove();
                document.removeEventListener('keydown', onKeydown);
                if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
            };
            const onKeydown = (e) => {
                if (e.key === 'Escape') closePreview();
            };

            modal.querySelector('[data-action="close"]').addEventListener('click', closePreview);
            modal.querySelector('[data-action="download"]').addEventListener('click', () => {
                const displayName = normalizePreviewFileName(fileName, displayType);
                downloadBlob(fileBytes, displayName || 'file', 'application/octet-stream');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closePreview();
            });
            document.addEventListener('keydown', onKeydown);
            document.body.appendChild(modal);
            const closeBtn = modal.querySelector('[data-action="close"]');
            if (closeBtn) closeBtn.focus();
        }

        function showError(message) {
            loadingDiv.style.display = 'none';
            document.querySelector('.upload-section').style.display = 'none';
            infoSection.classList.add('visible');
            if (infoGrid) {
                infoGrid.innerHTML = '';
                dataSection.innerHTML = `<div class="error">${message}</div><button class="reset-btn" onclick="reset()">Try Again</button>`;
            } else {
                infoSection.innerHTML = `<div class="error">${message}</div><button class="reset-btn" onclick="reset()">Try Again</button>`;
            }
        }

        // CRC-32 calculation function
        function calculateCRC32(data) {
            const table = [];
            for (let i = 0; i < 256; i++) {
                let crc = i;
                for (let j = 0; j < 8; j++) {
                    crc = (crc & 1) ? (0xEDB88320 ^ (crc >>> 1)) : (crc >>> 1);
                }
                table[i] = crc;
            }
            
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < data.length; i++) {
                crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function reconstructZip(files) {
            // Reconstruct a proper ZIP file from extracted files
            
            // Build a list of files that have been decompressed
            const decompressedBaseNames = new Set();
            files.forEach(f => {
                if (f.isDecompressed && f.name.endsWith(' (decompressed)')) {
                    // Extract base name (e.g., "db (decompressed)" -> "db")
                    const baseName = f.name.slice(0, -15); // Remove " (decompressed)"
                    decompressedBaseNames.add(baseName + '.gz');
                }
            });
            
            // Filter: include decompressed versions, exclude .gz files that were decompressed
            const validFiles = files.filter(f => {
                if (!f.data || f.data.length === undefined) return false;
                
                // If this is a decompressed version, include it
                if (f.isDecompressed) return true;
                
                // If this is a .gz file that has a decompressed version, exclude it
                if (f.name.endsWith('.gz') && decompressedBaseNames.has(f.name)) return false;
                
                // Otherwise include it
                return true;
            });
            
            validFiles.forEach(f => {
                const dataLen = f.data ? (f.data.length || f.data.byteLength || 0) : 0;
            });
            
            const encoder = new TextEncoder();
            let zipData = [];
            let centralDirectory = [];
            let offset = 0;

            validFiles.forEach(file => {
                // Ensure data is a Uint8Array
                let fileData;
                if (file.data instanceof Uint8Array) {
                    fileData = file.data;
                } else if (Array.isArray(file.data)) {
                    fileData = new Uint8Array(file.data);
                } else if (file.data.buffer) {
                    fileData = new Uint8Array(file.data.buffer);
                } else {
                    console.error('Cannot convert file data to Uint8Array:', file.name, typeof file.data);
                    return; // Skip this file
                }
                
                if (!fileData || fileData.length === 0) {
                    console.warn('Skipping file with no data:', file.name);
                    return;
                }

                // Local file header
                let fileName = file.name;
                
                // If this is a decompressed file, remove the " (decompressed)" suffix
                if (file.isDecompressed && fileName.endsWith(' (decompressed)')) {
                    fileName = fileName.slice(0, -15); // Remove " (decompressed)"
                }
                
                const fileNameBytes = encoder.encode(fileName);
                const fileSize = fileData.length;

                // Local file header signature
                const lfhSignature = new Uint8Array([0x50, 0x4b, 0x03, 0x04]);
                const lfhVersion = new Uint8Array([0x14, 0x00]); // version 2.0
                const lfhFlags = new Uint8Array([0x00, 0x00]); // general purpose bit flag
                const lfhCompression = new Uint8Array([0x00, 0x00]); // no compression

                // Simplified times/dates (1980-01-01 00:00:00)
                const lfhTime = new Uint8Array([0x00, 0x00]);
                const lfhDate = new Uint8Array([0x21, 0x00]);

                // Calculate CRC-32
                const crc32Value = calculateCRC32(fileData);
                const crc32 = new Uint8Array(4);
                new DataView(crc32.buffer).setUint32(0, crc32Value, true);

                // Size fields (little-endian)
                const compressedSize = new Uint8Array(4);
                const uncompressedSize = new Uint8Array(4);
                new DataView(compressedSize.buffer).setUint32(0, fileSize, true);
                new DataView(uncompressedSize.buffer).setUint32(0, fileSize, true);

                const fileNameLength = new Uint8Array(2);
                new DataView(fileNameLength.buffer).setUint16(0, fileNameBytes.length, true);

                const extraFieldLength = new Uint8Array(2);
                new DataView(extraFieldLength.buffer).setUint16(0, 0, true);

                // Build local file header
                const lfh = new Uint8Array(
                    lfhSignature.length + lfhVersion.length + lfhFlags.length + 
                    lfhCompression.length + lfhTime.length + lfhDate.length + 
                    crc32.length + compressedSize.length + uncompressedSize.length + 
                    fileNameLength.length + extraFieldLength.length + fileNameBytes.length
                );

                let pos = 0;
                lfh.set(lfhSignature, pos); pos += lfhSignature.length;
                lfh.set(lfhVersion, pos); pos += lfhVersion.length;
                lfh.set(lfhFlags, pos); pos += lfhFlags.length;
                lfh.set(lfhCompression, pos); pos += lfhCompression.length;
                lfh.set(lfhTime, pos); pos += lfhTime.length;
                lfh.set(lfhDate, pos); pos += lfhDate.length;
                lfh.set(crc32, pos); pos += crc32.length;
                lfh.set(compressedSize, pos); pos += compressedSize.length;
                lfh.set(uncompressedSize, pos); pos += uncompressedSize.length;
                lfh.set(fileNameLength, pos); pos += fileNameLength.length;
                lfh.set(extraFieldLength, pos); pos += extraFieldLength.length;
                lfh.set(fileNameBytes, pos);

                zipData.push(lfh);
                zipData.push(fileData);

                // Build central directory record
                const cdfhSignature = new Uint8Array([0x50, 0x4b, 0x01, 0x02]);
                const cdfhVersionMade = new Uint8Array([0x14, 0x00]); // Unix, version 2.0
                const cdfhVersionNeeded = new Uint8Array([0x14, 0x00]);
                const cdfhFlags = new Uint8Array([0x00, 0x00]);
                const cdfhCompression = new Uint8Array([0x00, 0x00]);

                const offsetBytes = new Uint8Array(4);
                new DataView(offsetBytes.buffer).setUint32(0, offset, true);

                const externalAttrs = new Uint8Array([0x00, 0x00, 0x00, 0x00]);

                // File comment length (2 bytes)
                const fileCommentLength = new Uint8Array(2);
                
                // Disk number start (2 bytes)
                const diskStart = new Uint8Array(2);
                
                // Internal/external attributes (2 + 4 bytes)
                const internalAttrs = new Uint8Array(2);

                // Calculate total size: 46 bytes fixed + fileName length
                const cdfhSize = 46 + fileNameBytes.length;
                const cdfh = new Uint8Array(cdfhSize);

                pos = 0;
                cdfh.set(cdfhSignature, pos); pos += cdfhSignature.length;
                cdfh.set(cdfhVersionMade, pos); pos += cdfhVersionMade.length;
                cdfh.set(cdfhVersionNeeded, pos); pos += cdfhVersionNeeded.length;
                cdfh.set(cdfhFlags, pos); pos += cdfhFlags.length;
                cdfh.set(cdfhCompression, pos); pos += cdfhCompression.length;
                cdfh.set(lfhTime, pos); pos += lfhTime.length;
                cdfh.set(lfhDate, pos); pos += lfhDate.length;
                cdfh.set(crc32, pos); pos += crc32.length;
                cdfh.set(compressedSize, pos); pos += compressedSize.length;
                cdfh.set(uncompressedSize, pos); pos += uncompressedSize.length;
                cdfh.set(fileNameLength, pos); pos += fileNameLength.length;
                cdfh.set(extraFieldLength, pos); pos += extraFieldLength.length;
                cdfh.set(fileCommentLength, pos); pos += fileCommentLength.length;
                cdfh.set(diskStart, pos); pos += diskStart.length;
                cdfh.set(internalAttrs, pos); pos += internalAttrs.length;
                cdfh.set(externalAttrs, pos); pos += externalAttrs.length;
                cdfh.set(offsetBytes, pos); pos += offsetBytes.length;
                cdfh.set(fileNameBytes, pos);

                centralDirectory.push(cdfh);

                // Update offset for next file
                offset += lfh.length + fileSize;
            });

            // Merge all central directory records
            let cdSize = 0;
            centralDirectory.forEach(cdfh => cdSize += cdfh.length);

            // Build End of Central Directory record
            const eocdSignature = new Uint8Array([0x50, 0x4b, 0x05, 0x06]);
            const diskNumber = new Uint8Array([0x00, 0x00]);
            const diskWithCD = new Uint8Array([0x00, 0x00]);
            const cdRecordCount = new Uint8Array(2);
            new DataView(cdRecordCount.buffer).setUint16(0, validFiles.length, true);

            const totalCDRecords = new Uint8Array(2);
            new DataView(totalCDRecords.buffer).setUint16(0, validFiles.length, true);

            const cdSizeBytes = new Uint8Array(4);
            new DataView(cdSizeBytes.buffer).setUint32(0, cdSize, true);

            const cdOffsetBytes = new Uint8Array(4);
            new DataView(cdOffsetBytes.buffer).setUint32(0, offset, true);

            const commentLength = new Uint8Array(2);
            const comment = new Uint8Array(0);

            const eocd = new Uint8Array(
                eocdSignature.length + diskNumber.length + diskWithCD.length +
                cdRecordCount.length + totalCDRecords.length + cdSizeBytes.length +
                cdOffsetBytes.length + commentLength.length + comment.length
            );

            pos = 0;
            eocd.set(eocdSignature, pos); pos += eocdSignature.length;
            eocd.set(diskNumber, pos); pos += diskNumber.length;
            eocd.set(diskWithCD, pos); pos += diskWithCD.length;
            eocd.set(cdRecordCount, pos); pos += cdRecordCount.length;
            eocd.set(totalCDRecords, pos); pos += totalCDRecords.length;
            eocd.set(cdSizeBytes, pos); pos += cdSizeBytes.length;
            eocd.set(cdOffsetBytes, pos); pos += cdOffsetBytes.length;
            eocd.set(commentLength, pos); pos += commentLength.length;
            eocd.set(comment, pos);

            // Combine all parts
            zipData.push(...centralDirectory);
            zipData.push(eocd);

            // Create final ZIP file
            const totalSize = zipData.reduce((sum, part) => sum + part.length, 0);
            const finalZip = new Uint8Array(totalSize);
            let finalPos = 0;
            zipData.forEach((part, idx) => {
                if (finalPos + part.length > totalSize) {
                    console.error('ERROR: Part would exceed buffer! finalPos:', finalPos, 'part.length:', part.length, 'totalSize:', totalSize);
                    return;
                }
                finalZip.set(part, finalPos);
                finalPos += part.length;
            });

            return finalZip;
        }

        function downloadZip() {
            if (!window.backupFiles || window.backupFiles.length === 0) {
                alert('No backup files to download');
                return;
            }

            const zipData = reconstructZip(window.backupFiles);
            const base = backupBaseName(window._backupFileName);
            const suffix = window._backupType === 'unifi' ? 'contents' : 'fixed';
            downloadBlob(zipData, `${base}.${suffix}.zip`, 'application/zip');
        }

        function downloadDecryptedArchive() {
            const archive = window._decryptedArchive;
            if (!archive || !archive.bytes || !archive.bytes.length) {
                alert('No decrypted archive available to download');
                return;
            }

            const base = backupBaseName(window._backupFileName);
            downloadBlob(archive.bytes, `${base}.decrypted.${archive.extension}`, archive.mime);
        }

        function reset() {
            fileInput.value = '';
            infoSection.classList.remove('visible');
            if (infoGrid) infoGrid.innerHTML = '';
            if (dataSection) dataSection.innerHTML = '';
            setBackupTitle('Backup Information');
            document.querySelector('.upload-section').style.display = 'block';
            loadingDiv.style.display = 'none';
            window.backupFiles = null;
            window._backupFileName = null;
            window._decryptedArchive = null;
            clearCachedBackup();
        }

        restoreCachedBackup();

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function normalizePreviewFileName(fileName, displayType) {
            let name = String(fileName || '').replace(/\\/g, '/');
            name = name.split('/').pop() || name;
            name = name.replace(/\s*\(decompressed\)\s*$/i, '');
            if ((displayType === 'gzip-text' || displayType === 'text') && /\.gz$/i.test(name)) {
                name = name.replace(/\.gz$/i, '');
            }
            return name;
        }

        function getFileExtension(fileName) {
            const base = normalizePreviewFileName(fileName);
            const dot = base.lastIndexOf('.');
            if (dot <= 0 || dot === base.length - 1) return '';
            return base.slice(dot + 1).toLowerCase();
        }

        function getFileTypeBadge(fileName) {
            const base = (fileName.split('/').pop() || fileName)
                .replace(/\s*\(decompressed\)\s*$/i, '')
                .toLowerCase();
            const ext = getFileExtension(base);
            if (base === 'db' || base.endsWith('.bson') || /^db([._(-]|$)/.test(base)) {
                return { label: base.endsWith('.gz') ? 'db.gz' : (ext === 'bson' ? 'bson' : 'db'), className: 'badge-info' };
            }
            if (!ext) return { label: 'file', className: 'badge-muted' };
            if (ext === 'json' || ext === 'yaml' || ext === 'yml' || ext === 'properties' || ext === 'txt') {
                return { label: ext, className: 'badge-success' };
            }
            if (ext === 'gz' || ext === 'dat' || ext === 'zip') {
                return { label: ext, className: 'badge-warning' };
            }
            return { label: ext, className: 'badge-muted' };
        }

        function formatJsonPreview(text, fileName, displayType) {
            if (displayType === 'hex' || displayType === 'bson') return text;
            const preferJson = displayType === 'bson-json' || getFileExtension(fileName) === 'json';
            const trimmed = text.trim();
            if (!preferJson && !(trimmed.startsWith('{') || trimmed.startsWith('['))) return text;
            try {
                return JSON.stringify(JSON.parse(trimmed), null, 2);
            } catch (e) {
                return text;
            }
        }

        function looksLikeJson(text) {
            const trimmed = text.trim();
            if (!trimmed || (trimmed[0] !== '{' && trimmed[0] !== '[')) return false;
            try {
                JSON.parse(trimmed);
                return true;
            } catch (e) {
                // Truncated previews may not parse; still highlight if shape looks like JSON
                return /^[\s]*[\[{]/.test(trimmed) && /[",:\d\[\]{}truefalsenull\s.-]/.test(trimmed);
            }
        }

        function shouldHighlightJson(fileName, displayType, content) {
            if (displayType === 'bson-json') return true;
            if (getFileExtension(fileName) === 'json') return true;
            if (displayType === 'hex' || displayType === 'bson') return false;
            return looksLikeJson(content);
        }

        function looksLikeProperties(text) {
            const lines = String(text || '').split(/\r?\n/).slice(0, 40);
            if (!lines.length) return false;
            let hits = 0;
            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                if (/^[#!]/.test(trimmed)) { hits++; continue; }
                if (/^[A-Za-z0-9_.\-]+\s*[=:]/.test(trimmed)) hits++;
            }
            return hits >= 2;
        }

        function shouldHighlightProperties(fileName, displayType, content) {
            const name = normalizePreviewFileName(fileName, displayType);
            if (getFileExtension(name) === 'properties') return true;
            if (displayType === 'hex' || displayType === 'bson' || displayType === 'bson-json') return false;
            return looksLikeProperties(content);
        }

        function renderHighlightedPreview(text, fileName, displayType) {
            // Prefer properties over JSON when the name/content indicates a .properties file
            if (shouldHighlightProperties(fileName, displayType, text)) return highlightProperties(text);
            if (shouldHighlightJson(fileName, displayType, text)) return highlightJson(text);
            return escapeHtml(text);
        }

        function highlightJson(text) {
            const escaped = escapeHtml(text);
            return escaped.replace(
                /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\b(null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|([{}\[\],:])/g,
                (match, stringLiteral, isKey, boolLiteral, nullLiteral, punctuation) => {
                    if (stringLiteral) {
                        if (isKey) {
                            return `<span class="json-key">${stringLiteral}</span>${isKey}`;
                        }
                        return `<span class="json-string">${stringLiteral}</span>`;
                    }
                    if (boolLiteral) return `<span class="json-boolean">${boolLiteral}</span>`;
                    if (nullLiteral) return `<span class="json-null">${nullLiteral}</span>`;
                    if (punctuation) return `<span class="json-punctuation">${punctuation}</span>`;
                    return `<span class="json-number">${match}</span>`;
                }
            );
        }

        function highlightPropertyValue(value) {
            if (!value) return value;
            return value.replace(
                /\b(true|false)\b|\b(null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
                (match, boolLiteral, nullLiteral) => {
                    if (boolLiteral) return `<span class="json-boolean">${boolLiteral}</span>`;
                    if (nullLiteral) return `<span class="json-null">${nullLiteral}</span>`;
                    return `<span class="json-number">${match}</span>`;
                }
            );
        }

        function highlightPropertyAssignment(text) {
            // Keys are identifiers (dots/underscores/hyphens); avoids mistaking prose comments with ":" for assignments
            const match = text.match(/^(\s*)([A-Za-z0-9_.\-]+)(\s*[=:]\s*)(.*)$/);
            if (!match) return null;
            const [, ws, key, sep, value] = match;
            return `${ws}<span class="json-key">${key}</span><span class="json-punctuation">${sep}</span><span class="json-string">${highlightPropertyValue(value)}</span>`;
        }

        function highlightProperties(text) {
            return String(text).split(/\r?\n/).map((line) => {
                const escaped = escapeHtml(line);
                if (/^\s*[#!]/.test(escaped)) {
                    return `<span class="prop-comment">${escaped}</span>`;
                }
                return highlightPropertyAssignment(escaped) || escaped;
            }).join('\n');
        }
    </script>
