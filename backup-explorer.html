        @media (max-width: 640px) {
            body { padding: 16px 12px 28px; }
            .upload-section, .info-section { padding: 22px 18px; }
            .drop-zone { padding: 40px 16px; }
            .collection-table th:nth-child(2),
            .collection-table td:nth-child(2) { display: none; }
            .theme-popover {
                right: 12px;
                left: 12px;
                width: auto;
            }
            .theme-toggle { right: 12px; }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Choose theme" aria-expanded="false" aria-haspopup="true" title="Choose theme">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2H9m8-9a2 2 0 012-2 2 2 0 012 2v2a2 2 0 01-2 2" />
        </svg>
        <span id="themeLabel">Theme</span>
    </button>
    <div class="theme-popover" id="themePopover" role="menu" aria-label="Paper theme variations"></div>
    <div class="container">
        <div class="header">
            <h1>UniFi Backup Explorer</h1>
            <p>Decode and explore .unf and .unifi backup files locally in your browser</p>
        </div>
        
        <div class="upload-section">
            <div class="drop-zone" id="dropZone">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p>Drop your <strong>.unf</strong> or <strong>.unifi</strong> backup file here</p>
                <span>or click to browse</span>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".unf,.unifi">
        </div>
        
        <div class="info-section" id="infoSection">
            <div class="file-info">
                <h2>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <span class="backup-filename" id="backupTitle">Backup Information</span>
                </h2>
                <div class="info-grid" id="infoGrid"></div>
            </div>
            
            <div class="data-section" id="dataSection"></div>
            
            <button class="reset-btn" onclick="reset()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Upload Another File
            </button>
        </div>
        
        <div id="loadingDiv" class="upload-section loading" style="display: none;">
            <div class="spinner"></div>
            <p>Processing backup file...</p>
        </div>
    </div>

    <div class="page-drop-overlay" id="pageDropOverlay" aria-hidden="true">
        <div class="page-drop-overlay-inner">
            <p>Drop to open a new backup</p>
            <span>Accepts <strong>.unf</strong> or <strong>.unifi</strong> files</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bson@6.2.0/dist/bson.browser.umd.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bson@7.0.0/lib/bson.bundle.min.js"></script>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const infoSection = document.getElementById('infoSection');
        const loadingDiv = document.getElementById('loadingDiv');
        const infoGrid = document.getElementById('infoGrid');
        const dataSection = document.getElementById('dataSection');
        const backupTitle = document.getElementById('backupTitle');
        const themeToggle = document.getElementById('themeToggle');
        const themePopover = document.getElementById('themePopover');
        const themeLabel = document.getElementById('themeLabel');

        const ICON_DOWNLOAD = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>';
        const ICON_BACKUP_TYPE = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>';
        const ICON_FILE_SIZE = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>';
        const ICON_MODIFIED = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
        const ICON_FILES = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>';

        function infoTile(icon, label, valueHtml) {
            return `<div class="info-item"><label>${icon}<span>${label}</span></label><value>${valueHtml}</value></div>`;
        }

        function setBackupTitle(name) {
            if (backupTitle) backupTitle.textContent = name || 'Backup Information';
        }

        function downloadBlob(data, filename, mimeType) {
            const blob = new Blob([data], { type: mimeType || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function backupBaseName(fileName) {
            return String(fileName || 'backup').replace(/\.(unf|unifi)$/i, '');
        }

        function setDecryptedArchive(bytes, { extension, mime, label }) {
            window._decryptedArchive = bytes && bytes.length
                ? { bytes, extension, mime, label }
                : null;
        }

        const BACKUP_DB_NAME = 'ube-backup-store';
        const BACKUP_DB_VERSION = 1;
        const BACKUP_STORE = 'backups';
        const BACKUP_KEY = 'current';

        function openBackupDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(BACKUP_DB_NAME, BACKUP_DB_VERSION);
                request.onerror = () => reject(request.error || new Error('Failed to open backup store'));
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(BACKUP_STORE)) {
                        db.createObjectStore(BACKUP_STORE);
                    }
                };
            });
        }

        async function withBackupStore(mode, fn) {
            const db = await openBackupDb();
            try {
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(BACKUP_STORE, mode);
                    const store = tx.objectStore(BACKUP_STORE);
                    let request;
                    try {
                        request = fn(store);
                    } catch (err) {
                        reject(err);
                        return;
                    }

                    let settled = false;
                    const settle = (fnSettle, value) => {
                        if (settled) return;
                        settled = true;
                        fnSettle(value);
                    };

                    if (request && typeof request === 'object' && 'onsuccess' in request) {
                        request.onsuccess = () => settle(resolve, request.result);
                        request.onerror = () => settle(reject, request.error || new Error('Backup store request failed'));
                    } else {
                        tx.oncomplete = () => settle(resolve, request);
                    }

                    tx.onerror = () => settle(reject, tx.error || new Error('Backup store transaction failed'));
                    tx.onabort = () => settle(reject, tx.error || new Error('Backup store transaction aborted'));
                });
            } finally {
                db.close();
            }
        }

        async function saveCachedBackup(file, arrayBuffer) {
            await withBackupStore('readwrite', (store) => store.put({
                name: file.name,
                type: file.type || 'application/octet-stream',
                lastModified: file.lastModified || Date.now(),
                size: arrayBuffer.byteLength,
                buffer: arrayBuffer
            }, BACKUP_KEY));
        }

        async function loadCachedBackup() {
            const result = await withBackupStore('readonly', (store) => store.get(BACKUP_KEY));
            return result || null;
        }

        async function clearCachedBackup() {
            try {
                await withBackupStore('readwrite', (store) => store.delete(BACKUP_KEY));
            } catch (err) {
                console.warn('Could not clear cached backup:', err);
            }
        }

        async function restoreCachedBackup() {
            try {
                const cached = await loadCachedBackup();
                if (!cached || !cached.buffer || !cached.name) return;
                const file = new File([cached.buffer], cached.name, {
                    type: cached.type || 'application/octet-stream',
                    lastModified: cached.lastModified || Date.now()
                });
                await handleFile(file, { fromCache: true });
            } catch (err) {
                console.warn('Could not restore cached backup:', err);
                await clearCachedBackup();
            }
        }

        const THEMES = [
            { id: 'paper', label: 'Paper', swatch: '#f4f1ea', accent: '#7a8b5f' },
            { id: 'parchment', label: 'Parchment', swatch: '#f0e7d3', accent: '#9c7c4a' },
            { id: 'cream', label: 'Cream', swatch: '#f6f0e2', accent: '#b98a4e' },
            { id: 'ivory', label: 'Ivory', swatch: '#f7f4ec', accent: '#6b7f8e' },
            { id: 'kraft', label: 'Kraft', swatch: '#e3d5b8', accent: '#8a6f3e' },
            { id: 'charcoal', label: 'Charcoal', swatch: '#33322e', accent: '#a89c82' },
            { id: 'night', label: 'Night', swatch: '#262a2e', accent: '#8fa6b5' }
        ].map(t => ({ ...t, swatchBg: t.swatch }));
        const DEFAULT_THEME = 'paper';

        function getTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            return THEMES.some(t => t.id === current) ? current : DEFAULT_THEME;
        }

        function applyTheme(theme) {
            const next = THEMES.some(t => t.id === theme) ? theme : DEFAULT_THEME;
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('ube-theme', next);
            const meta = THEMES.find(t => t.id === next);
            if (themeLabel) themeLabel.textContent = meta ? meta.label : 'Theme';
            if (themeToggle) themeToggle.setAttribute('aria-label', `Theme: ${meta ? meta.label : next}`);
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor && meta) themeColor.setAttribute('content', meta.swatchBg);
            if (themePopover) {
                themePopover.querySelectorAll('.theme-option').forEach(btn => {
                    const active = btn.dataset.theme === next;
                    btn.classList.toggle('active', active);
                    btn.setAttribute('aria-checked', active ? 'true' : 'false');
                });
            }
        }

        function buildThemePicker() {
            if (!themePopover) return;
            themePopover.innerHTML = '';
            THEMES.forEach(({ id, label, swatch, accent }) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'theme-option';
                btn.dataset.theme = id;
                btn.setAttribute('role', 'menuitemradio');
                btn.innerHTML = `<span class="theme-swatch" style="background: linear-gradient(135deg, ${swatch} 55%, ${accent} 55%)" aria-hidden="true"></span><span>${label}</span>`;
                btn.addEventListener('click', () => {
                    applyTheme(id);
                    closeThemePopover();
                });
                themePopover.appendChild(btn);
            });
            applyTheme(getTheme());
        }

        function closeThemePopover() {
            if (!themePopover) return;
            themePopover.classList.remove('open');
            if (themeToggle) themeToggle.setAttribute('aria-expanded', 'false');
        }

        function toggleThemePopover() {
            if (!themePopover) return;
            const open = themePopover.classList.toggle('open');
            themeToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        buildThemePicker();

        if (themeToggle) {
            themeToggle.addEventListener('click', toggleThemePopover);
        }

        document.addEventListener('click', (e) => {
            if (!themePopover || !themePopover.classList.contains('open')) return;
            if (themePopover.contains(e.target) || (themeToggle && themeToggle.contains(e.target))) return;
            closeThemePopover();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeThemePopover();
        });

        function openFileDialog() {
            try {
                if (fileInput && typeof fileInput.showPicker === 'function') {
                    fileInput.showPicker();
                    return;
                }
                fileInput.click();
            } catch (err) {
                console.warn('File dialog open failed:', err);
            }
        }

        function isBackupFileName(name) {
            const nameLower = String(name || '').toLowerCase();
            return nameLower.endsWith('.unf') || nameLower.endsWith('.unifi');
        }

        function isFileDragEvent(e) {
            return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
        }

        function isProcessingBackup() {
            return loadingDiv.style.display === 'block';
        }

        function isBrowsingBackup() {
            return infoSection.classList.contains('visible') && !isProcessingBackup();
        }

        function setPageDragActive(active) {
            document.body.classList.toggle('page-drag-over', active);
            dropZone.classList.toggle('drag-over', active && dropZone.offsetParent !== null);
            const overlay = document.getElementById('pageDropOverlay');
            if (overlay) overlay.setAttribute('aria-hidden', active ? 'false' : 'true');
        }

        // Drag and drop handlers (document-level so drops work while browsing)
        dropZone.addEventListener('click', () => {
            openFileDialog();
        });

        // Keep a stacking context for drop zone interactions
        dropZone.style.position = 'relative';

        let pageDragDepth = 0;

        document.addEventListener('dragenter', (e) => {
            if (!isFileDragEvent(e) || isProcessingBackup()) return;
            e.preventDefault();
            pageDragDepth += 1;
            if (pageDragDepth === 1) setPageDragActive(true);
        });

        document.addEventListener('dragover', (e) => {
            if (!isFileDragEvent(e)) return;
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = isProcessingBackup() ? 'none' : 'copy';
        }, true);

        document.addEventListener('dragleave', (e) => {
            if (!isFileDragEvent(e)) return;
            pageDragDepth = Math.max(0, pageDragDepth - 1);
            if (pageDragDepth === 0) setPageDragActive(false);
        });

        document.addEventListener('drop', (e) => {
            if (!isFileDragEvent(e)) return;
            e.preventDefault();
            pageDragDepth = 0;
            setPageDragActive(false);
            if (isProcessingBackup()) return;

            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (!file) return;

            // Avoid a second load if the hidden file input also receives the drop
            if (fileInput) fileInput.value = '';

            // While browsing, ignore invalid drops so the current view stays intact
            if (!isBackupFileName(file.name) && isBrowsingBackup()) return;
            handleFile(file);
        }, true);
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file, { fromCache = false } = {}) {
            const nameLower = file.name.toLowerCase();
            const isUnf = nameLower.endsWith('.unf');
            const isUnifi = nameLower.endsWith('.unifi');
            if (!isBackupFileName(file.name)) {
                showError('Please select a .unf or .unifi backup file');
                return;
            }

            document.querySelector('.upload-section').style.display = 'none';
            infoSection.classList.remove('visible');
            loadingDiv.style.display = 'block';
            window._backupType = isUnifi ? 'unifi' : 'unf';
            window._decryptedArchive = null;
            window._backupFileName = file.name;

            try {
                const arrayBuffer = await file.arrayBuffer();
                if (!fromCache) {
                    try {
                        await saveCachedBackup(file, arrayBuffer);
                    } catch (persistErr) {
                        console.warn('Could not persist backup for refresh:', persistErr);
                    }
                }
                const data = new Uint8Array(arrayBuffer);

                if (isUnifi) {
                    const files = decryptAndExtractUnifi(data);
                    processExtractedFiles(file, files);
                    return;
                }
                
                // UniFi uses static AES-128-CBC encryption (hardcoded in UniFi software)
                // Key and IV are NOT derived - they are static values
                const key = CryptoJS.enc.Latin1.parse('bcyangkmluohmars'); // 16 bytes
                const iv = CryptoJS.enc.Latin1.parse('ubntenterpriseap');  // 16 bytes

                // Convert encrypted data to CryptoJS WordArray without Function.apply (avoids huge arg list stack overflow)
                const ciphertext = uint8ArrayToWordArray(data);
                
                // Decrypt with NoPadding (UniFi doesn't use padding)
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: ciphertext },
                    key,
                    { 
                        iv: iv, 
                        mode: CryptoJS.mode.CBC, 
                        padding: CryptoJS.pad.NoPadding 
                    }
                );
                
                let decryptedBytes = wordArrayToUint8Array(decrypted);

                // Check if this is a ZIP file (magic bytes: PK)
                if (decryptedBytes[0] !== 0x50 || decryptedBytes[1] !== 0x4b) {
                    throw new Error('Decrypted data is not a ZIP file. Decryption may have failed.');
                }

                // Find the actual ZIP end to handle any trailing padding
                // ZIP files end with the End of Central Directory (EOCD) record
                // which has magic bytes 0x50 0x4b 0x05 0x06
                let foundEnd = false;
                
                // Search backwards from near the end for EOCD signature
                // The EOCD must be in the last 65557 bytes per ZIP spec, but search the whole file
                for (let i = decryptedBytes.length - 22; i >= 0; i--) {
                    // Check for EOCD signature at this position (need at least 22 bytes from here)
                    if (i + 21 < decryptedBytes.length &&
                        decryptedBytes[i] === 0x50 && decryptedBytes[i+1] === 0x4b && 
                        decryptedBytes[i+2] === 0x05 && decryptedBytes[i+3] === 0x06) {
                        
                        foundEnd = true;
                        
                        // Read the comment length (bytes 20-21 of EOCD, little-endian)
                        const commentLength = decryptedBytes[i+20] | (decryptedBytes[i+21] << 8);
                        
                        // EOCD record size is 22 + commentLength
                        const eocdEnd = i + 22 + commentLength;
                        
                        // Trim any data after the EOCD
                        if (eocdEnd < decryptedBytes.length) {
                            decryptedBytes = decryptedBytes.slice(0, eocdEnd);
                        }
                        break;
                    }
                }
                
                if (!foundEnd) {
                    console.warn('Could not find EOCD record - ZIP might be truncated');
                    // Try a more manual search - just look for the signature anywhere
                    for (let i = decryptedBytes.length - 1; i >= 0; i--) {
                        if (decryptedBytes[i] === 0x50 && i + 3 < decryptedBytes.length &&
                            decryptedBytes[i+1] === 0x4b && decryptedBytes[i+2] === 0x05 && decryptedBytes[i+3] === 0x06) {
                            
                            // Found EOCD - now search for the central directory
                            let cdOffset = -1;
                            for (let j = i - 1; j >= 0; j--) {
                                if (decryptedBytes[j] === 0x50 && decryptedBytes[j+1] === 0x4b && 
                                    decryptedBytes[j+2] === 0x01 && decryptedBytes[j+3] === 0x02) {
                                    cdOffset = j;
                                    break;
                                }
                            }
                            
                            if (cdOffset >= 0) {
                                // We found both CD and EOCD - fix the EOCD
                                const cdSize = i - cdOffset;
                                
                                // Read the number of entries from EOCD before fixing
                                let numEntries = 0;
                                if (i + 9 < decryptedBytes.length) {
                                    numEntries = decryptedBytes[i+8] | (decryptedBytes[i+9] << 8);
                                }
                                
                                // Pad EOCD if incomplete
                                let dataToUse = decryptedBytes;
                                if (i + 21 >= decryptedBytes.length) {
                                    const missingBytes = 22 - (decryptedBytes.length - i);
                                    const padding = new Uint8Array(missingBytes);
                                    const padded = new Uint8Array(decryptedBytes.length + missingBytes);
                                    padded.set(decryptedBytes, 0);
                                    padded.set(padding, decryptedBytes.length);
                                    dataToUse = padded;
                                }
                                
                                // Fix the EOCD in the data
                                dataToUse[i+16] = cdOffset & 0xff;
                                dataToUse[i+17] = (cdOffset >> 8) & 0xff;
                                dataToUse[i+18] = (cdOffset >> 16) & 0xff;
                                dataToUse[i+19] = (cdOffset >> 24) & 0xff;
                                
                                dataToUse[i+12] = cdSize & 0xff;
                                dataToUse[i+13] = (cdSize >> 8) & 0xff;
                                dataToUse[i+14] = (cdSize >> 16) & 0xff;
                                dataToUse[i+15] = (cdSize >> 24) & 0xff;
                                
                                decryptedBytes = dataToUse;
                                foundEnd = true;
                            } else {
                                // No central directory found - try padding anyway
                                if (i + 21 >= decryptedBytes.length) {
                                    const missingBytes = 22 - (decryptedBytes.length - i);
                                    const padding = new Uint8Array(missingBytes);
                                    const padded = new Uint8Array(decryptedBytes.length + missingBytes);
                                    padded.set(decryptedBytes, 0);
                                    padded.set(padding, decryptedBytes.length);
                                    decryptedBytes = padded;
                                    foundEnd = true;
                                }
                            }
                            break;
                        }
                    }
                }

                // Parse the ZIP file
                try {
                    let zip;
                    try {
                        zip = await JSZip.loadAsync(decryptedBytes);
                    } catch (err) {
                        // If JSZip fails, try to work around common issues
                        
                        // Strategy 1: Remove trailing null bytes progressively
                        let trimmed = new Uint8Array(decryptedBytes);
                        let trimAttempt = 1;
                        while (trimmed.length > 1000 && trimmed[trimmed.length - 1] === 0x00) {
                            trimmed = trimmed.slice(0, -1);
                            try {
                                zip = await JSZip.loadAsync(trimmed);
                                break;
                            } catch (e) {
                                trimAttempt++;
                            }
                        }
                        
                        // Strategy 2: Try to fix the EOCD central directory offset
                        if (!zip && decryptedBytes.length > 22) {
                            
                            let eocdOffset = -1;
                            let cdOffset = -1;
                            
                            // Find EOCD signature (search from end backwards)
                            for (let i = decryptedBytes.length - 1; i >= Math.max(0, decryptedBytes.length - 65557); i--) {
                                if (decryptedBytes[i] === 0x50 && decryptedBytes[i+1] === 0x4b && 
                                    decryptedBytes[i+2] === 0x05 && decryptedBytes[i+3] === 0x06) {
                                    eocdOffset = i;
                                    break;
                                }
                            }
                            
                            // Find central directory signature (0x50 0x4b 0x01 0x02) - search backwards from EOCD
                            if (eocdOffset > 0) {
                                for (let i = eocdOffset - 1; i >= 0; i--) {
                                    if (decryptedBytes[i] === 0x50 && decryptedBytes[i+1] === 0x4b && 
                                        decryptedBytes[i+2] === 0x01 && decryptedBytes[i+3] === 0x02) {
                                        cdOffset = i;
                                        break;
                                    }
                                }
                            }
                            
                            if (eocdOffset > 0 && cdOffset > 0) {
                                
                                // Calculate correct CD size
                                const cdSize = eocdOffset - cdOffset;
                                
                                // Create a corrected copy with proper EOCD
                                const fixed = new Uint8Array(decryptedBytes);
                                
                                // Read current number of entries from EOCD
                                let numEntries = 0;
                                if (eocdOffset + 9 < fixed.length) {
                                    numEntries = fixed[eocdOffset+8] | (fixed[eocdOffset+9] << 8);
                                }
                                
                                // Fix the CD offset at bytes 16-19 of EOCD
                                fixed[eocdOffset+16] = cdOffset & 0xff;
                                fixed[eocdOffset+17] = (cdOffset >> 8) & 0xff;
                                fixed[eocdOffset+18] = (cdOffset >> 16) & 0xff;
                                fixed[eocdOffset+19] = (cdOffset >> 24) & 0xff;
                                
                                // Fix the CD size at bytes 12-15 of EOCD
                                fixed[eocdOffset+12] = cdSize & 0xff;
                                fixed[eocdOffset+13] = (cdSize >> 8) & 0xff;
                                fixed[eocdOffset+14] = (cdSize >> 16) & 0xff;
                                fixed[eocdOffset+15] = (cdSize >> 24) & 0xff;

                                try {
                                    zip = await JSZip.loadAsync(fixed);
                                    decryptedBytes = fixed;
                                } catch (e) {
                                }
                            }
                        }
                        
                        // Strategy 3: If still no zip, look for EOCD and extract clean ZIP
                        if (!zip) {
                            
                            for (let i = decryptedBytes.length - 22; i >= Math.max(0, decryptedBytes.length - 65557); i--) {
                                if (i + 21 < decryptedBytes.length &&
                                    decryptedBytes[i] === 0x50 && decryptedBytes[i+1] === 0x4b && 
                                    decryptedBytes[i+2] === 0x05 && decryptedBytes[i+3] === 0x06) {
                                    
                                    const commentLength = decryptedBytes[i+20] | (decryptedBytes[i+21] << 8);
                                    const validZipEnd = i + 22 + commentLength;
                                    
                                    const validZip = decryptedBytes.slice(0, Math.min(validZipEnd, decryptedBytes.length));
                                    try {
                                        zip = await JSZip.loadAsync(validZip);
                                        break;
                                    } catch (e) {
                                        console.warn('EOCD extraction failed:', e.message);
                                    }
                                    break;
                                }
                            }
                            
                            // Strategy 4: If still no luck, try brute force search through entire file
                            if (!zip) {
                                for (let i = decryptedBytes.length - 1; i >= 0; i--) {
                                    if (decryptedBytes[i] === 0x50 && i + 3 < decryptedBytes.length &&
                                        decryptedBytes[i+1] === 0x4b && decryptedBytes[i+2] === 0x05 && decryptedBytes[i+3] === 0x06) {

                                        let zipToTry = decryptedBytes;
                                        
                                        if (i + 21 < decryptedBytes.length) {
                                            // EOCD is complete
                                            const commentLength = decryptedBytes[i+20] | (decryptedBytes[i+21] << 8);
                                            const eocdEnd = i + 22 + commentLength;
                                            
                                            if (eocdEnd <= decryptedBytes.length) {
                                                zipToTry = decryptedBytes.slice(0, eocdEnd);
                                            }
                                        } else {
                                            // EOCD is incomplete - pad it
                                            const missingBytes = 22 - (decryptedBytes.length - i);
                                            const padding = new Uint8Array(missingBytes);
                                            const padded = new Uint8Array(decryptedBytes.length + missingBytes);
                                            padded.set(decryptedBytes, 0);
                                            padded.set(padding, decryptedBytes.length);
                                            zipToTry = padded;
                                        }
                                        
                                        try {
                                            zip = await JSZip.loadAsync(zipToTry);
                                            break;
                                        } catch (e) {
                                            console.warn('Failed:', e.message);
                                        }
                                    }
                                }
                            }
                        }
                        
                        if (!zip) {
                            throw err;  // Re-throw original error if all strategies failed
                        }
                    }
                    
                    const files = [];

                    for (const [filename, zipEntry] of Object.entries(zip.files)) {
                        if (!zipEntry.dir) {
                            const content = await zipEntry.async('uint8array');
                            files.push({
                                name: filename,
                                size: content.length,
                                data: content
                            });
                        }
                    }

                    if (files.length === 0) {
                        throw new Error('ZIP has no files');
                    }
                    
                    // Fallback: if we only got 1 file but the backup should have more,
                    // try extracting by finding local file headers directly
                    if (files.length === 1) {
                        const lfhSignature = [0x50, 0x4b, 0x03, 0x04]; // Local File Header
                        
                        // Find all LFH positions
                        const lfhPositions = [];
                        for (let i = 0; i < decryptedBytes.length - 3; i++) {
                            if (decryptedBytes[i] === lfhSignature[0] && 
                                decryptedBytes[i+1] === lfhSignature[1] && 
                                decryptedBytes[i+2] === lfhSignature[2] && 
                                decryptedBytes[i+3] === lfhSignature[3]) {
                                lfhPositions.push(i);
                            }
                        }

                        // Try to extract each file from its LFH
                        for (let idx = 0; idx < lfhPositions.length; idx++) {
                            const lfhOffset = lfhPositions[idx];
                            const nextLfhOffset = idx + 1 < lfhPositions.length ? lfhPositions[idx + 1] : decryptedBytes.length;
                            
                            try {
                                // Read LFH to get filename and sizes
                                if (lfhOffset + 30 > decryptedBytes.length) continue;
                                
                                const flags = decryptedBytes[lfhOffset+6] | (decryptedBytes[lfhOffset+7] << 8);
                                const fileNameLen = decryptedBytes[lfhOffset+26] | (decryptedBytes[lfhOffset+27] << 8);
                                const extraLen = decryptedBytes[lfhOffset+28] | (decryptedBytes[lfhOffset+29] << 8);
                                const compressedSize = decryptedBytes[lfhOffset+18] | (decryptedBytes[lfhOffset+19] << 8) | 
                                                      (decryptedBytes[lfhOffset+20] << 16) | (decryptedBytes[lfhOffset+21] << 24);
                                const uncompressedSize = decryptedBytes[lfhOffset+22] | (decryptedBytes[lfhOffset+23] << 8) | 
                                                        (decryptedBytes[lfhOffset+24] << 16) | (decryptedBytes[lfhOffset+25] << 24);
                                const compressionMethod = decryptedBytes[lfhOffset+8] | (decryptedBytes[lfhOffset+9] << 8);
                                
                                if (fileNameLen === 0) continue;
                                
                                // Read filename
                                let fileName = '';
                                for (let i = 0; i < fileNameLen && lfhOffset + 30 + i < decryptedBytes.length; i++) {
                                    fileName += String.fromCharCode(decryptedBytes[lfhOffset + 30 + i]);
                                }
                                
                                // Data starts after LFH header, filename, and extra field
                                const dataStart = lfhOffset + 30 + fileNameLen + extraLen;
                                
                                // For files with data descriptor flag (0x08), the sizes in LFH are dummy/zero
                                // The real sizes are in the descriptor that comes AFTER the file data
                                // We need to find where the file data ends by looking for the descriptor signature
                                let dataEnd;
                                
                                if (fileName.endsWith('/')) {
                                    // Directory - no data
                                    dataEnd = dataStart;
                                } else if ((flags & 0x08) !== 0) {
                                    // File has data descriptor - find it by looking for signature 0x504b0708
                                    // The descriptor format is: [optional signature 4 bytes] + CRC (4) + compSize (4) + uncompSize (4)
                                    let foundDescriptor = false;
                                    
                                    // Search backwards from nextLfhOffset for the descriptor
                                    for (let i = nextLfhOffset - 16; i >= dataStart; i--) {
                                        if (decryptedBytes[i] === 0x50 && decryptedBytes[i+1] === 0x4b &&
                                            decryptedBytes[i+2] === 0x07 && decryptedBytes[i+3] === 0x08) {
                                            // Found descriptor signature
                                            dataEnd = i;
                                            foundDescriptor = true;
                                            break;
                                        }
                                    }
                                    
                                    if (!foundDescriptor) {
                                        // No descriptor found, use nextLfhOffset (shouldn't happen if flags are correct)
                                        dataEnd = nextLfhOffset;
                                    }
                                } else if (compressedSize > 0) {
                                    // Use compressed size if available
                                    dataEnd = Math.min(dataStart + compressedSize, nextLfhOffset);
                                } else if (uncompressedSize > 0) {
                                    // Use uncompressed size if available
                                    dataEnd = Math.min(dataStart + uncompressedSize, nextLfhOffset);
                                } else {
                                    // No size info - use everything until next file/structure
                                    dataEnd = nextLfhOffset;
                                }
                                
                                const fileData = decryptedBytes.slice(dataStart, dataEnd);
                                
                                // Log details for files with compression issues
                                if (compressionMethod === 8) {
                                }

                                // Decompress if the file is stored with DEFLATE compression (method 8)
                                let finalData = fileData;
                                
                                if (compressionMethod === 8) {
                                    try {
                                        if (typeof pako === 'undefined') {
                                        } else {
                                            // Convert fileData to proper Uint8Array if needed
                                            const dataToInflate = fileData instanceof Uint8Array ? fileData : new Uint8Array(fileData);
                                            
                                            // Method 8 = DEFLATE (raw), not gzip
                                            // Use inflateRaw for raw DEFLATE streams (no wrapper)
                                            try {
                                                finalData = pako.inflateRaw(dataToInflate);
                                            } catch (rawErr) {
                                                console.warn('✗ DEFLATE decompression failed for', fileName, ':', rawErr?.message || String(rawErr));
                                                // Keep original data if decompression fails
                                            }
                                        }
                                    } catch (err) {
                                        // Keep original compressed data if decompression fails
                                    }
                                }
                                
                                // Check if this file is not already in our list
                                if (!files.some(f => f.name === fileName)) {
                                    files.push({
                                        name: fileName,
                                        size: finalData.length,
                                        data: finalData,
                                        originalCompressionMethod: compressionMethod,
                                        originalCompressedSize: compressionMethod === 8 ? fileData.length : finalData.length
                                    });
                                    if (fileName.endsWith('.gz') || compressionMethod === 8) {
                                    }
                                }
                            } catch (e) {
                                console.warn('Failed to extract file at offset', lfhOffset, ':', e.message);
                            }
                        }
                    }
                    
                    setDecryptedArchive(decryptedBytes, {
                        extension: 'zip',
                        mime: 'application/zip',
                        label: 'Download Decrypted ZIP'
                    });
                    processExtractedFiles(file, files);
                    
                } catch (e) {
                    throw new Error('Failed to parse decrypted ZIP: ' + e.message);
                }
                
            } catch (error) {
                console.error('Error processing file:', error);
                await clearCachedBackup();
                showError('Error processing backup file: ' + error.message);
                loadingDiv.style.display = 'none';
                document.querySelector('.upload-section').style.display = 'block';
            }
        }

        function gunzipIgnoreTrailingPadding(data) {
            const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);

            const tryInflate = (buf) => {
                try {
                    const result = pako.inflate(buf);
                    if (result && result.length > 0) {
                        return result instanceof Uint8Array ? result : new Uint8Array(result);
                    }
                } catch (_) { /* invalid length or trailing junk */ }
                return null;
            };

            const direct = tryInflate(bytes);
            if (direct) return direct;

            // AES-CBC NoPadding aligns plaintext to 16 bytes; strip up to one block of
            // trailing padding so pako sees a single complete gzip member.
            for (let trim = 1; trim <= 15; trim++) {
                if (bytes.length - trim < 18) break;
                const result = tryInflate(bytes.slice(0, bytes.length - trim));
                if (result) return result;
            }

            throw new Error('Failed to gunzip .unifi payload (trailing padding?)');
        }

        function decryptAndExtractUnifi(data) {
            // UniFi OS .unifi: AES-256-CBC, IV = first 16 bytes, static 32-byte key
            const key = CryptoJS.enc.Hex.parse('e383b7c53698b36d4baea4ed22181ef73676bfd5d5b90005d9845ffd5dce985f');
            const ivBytes = data.slice(0, 16);
            let cipherBytes = data.slice(16);
            const rem = cipherBytes.length % 16;
            if (rem !== 0) {
                cipherBytes = cipherBytes.slice(0, cipherBytes.length - rem);
            }

            const iv = uint8ArrayToWordArray(ivBytes);
            const ciphertext = uint8ArrayToWordArray(cipherBytes);
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: ciphertext },
                key,
                {
                    iv: iv,
                    mode: CryptoJS.mode.CBC,
                    padding: CryptoJS.pad.NoPadding
                }
            );
            const decryptedBytes = wordArrayToUint8Array(decrypted);

            if (decryptedBytes.length < 2 || decryptedBytes[0] !== 0x1f || decryptedBytes[1] !== 0x8b) {
                throw new Error('Decrypted .unifi data is not gzip. Decryption may have failed.');
            }

            if (typeof pako === 'undefined') {
                throw new Error('pako library required to decompress .unifi gzip payload');
            }

            // Gunzip may need to strip up to one AES block of trailing NoPadding bytes.
            const tarBytes = gunzipIgnoreTrailingPadding(decryptedBytes);
            const files = parseTar(tarBytes);
            if (files.length === 0) {
                throw new Error('TAR archive is empty after decrypting .unifi');
            }
            setDecryptedArchive(tarBytes, {
                extension: 'tar',
                mime: 'application/x-tar',
                label: 'Download Decrypted TAR'
            });
            return files;
        }

        function processExtractedFiles(file, files) {
            let backupInfo = null;
            let databases = {};

            for (const f of files) {

                if (f.name.includes('backup_info') || f.name.includes('version') || f.name.endsWith('metadata.json')) {
                    try {
                        const text = new TextDecoder().decode(f.data);
                        backupInfo = text;
                    } catch (e) { }
                }

                if (f.name.endsWith('.bson') || f.name.includes('db')) {
                    databases[f.name] = f;
                }
            }

            const filesToProcess = [...files];
            for (const f of filesToProcess) {
                if (f.name.endsWith('.gz')) {
                    try {
                        const dataToCheck = f.data instanceof Uint8Array ? f.data : new Uint8Array(f.data);

                        if (dataToCheck.length >= 2 && dataToCheck[0] === 0x1f && dataToCheck[1] === 0x8b && typeof pako !== 'undefined') {
                            try {
                                const decompressed = pako.inflate(dataToCheck);
                                const baseName = f.name.slice(0, -3);

                                files.push({
                                    name: baseName + ' (decompressed)',
                                    size: decompressed.length,
                                    data: decompressed,
                                    isDecompressed: true
                                });

                            } catch (decompressErr) {
                                console.warn('Failed to decompress', f.name, ':', decompressErr?.message);
                            }
                        } else {
                        }
                    } catch (e) {
                        console.warn('Error processing', f.name, ':', e?.message);
                    }
                }
            }

            displayBackupContents(file, files, backupInfo, databases);
        }

        function wordArrayToUint8Array(wordArray) {
            const words = wordArray.words;
            const sigBytes = wordArray.sigBytes;
            const u8 = new Uint8Array(sigBytes);
            for (let i = 0; i < sigBytes; i++) {
                u8[i] = (words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
            }
            return u8;
        }

        function uint8ArrayToWordArray(u8Array) {
            const words = [];
            for (let i = 0; i < u8Array.length; i += 4) {
                words.push(
                    (u8Array[i] << 24) |
                    ((u8Array[i + 1] || 0) << 16) |
                    ((u8Array[i + 2] || 0) << 8) |
                    (u8Array[i + 3] || 0)
                );
            }
            return CryptoJS.lib.WordArray.create(words, u8Array.length);
        }

        function parseTar(data) {
            const files = [];
            let offset = 0;
            let pendingLongName = null;

            while (offset + 512 <= data.length) {
                // End of archive: zero block
                if (data[offset] === 0) {
                    let allZero = true;
                    for (let i = 0; i < 512; i++) {
                        if (data[offset + i] !== 0) { allZero = false; break; }
                    }
                    if (allZero) break;
                }

                const header = data.slice(offset, offset + 512);
                const typeflag = String.fromCharCode(header[156] || 0);
                const size = parseInt(readString(header, 124, 12).trim(), 8) || 0;
                const dataStart = offset + 512;
                const dataEnd = dataStart + size;
                const nextOffset = dataStart + Math.ceil(size / 512) * 512;

                // GNU long name: next entry uses this payload as its path
                if (typeflag === 'L') {
                    pendingLongName = readString(data, dataStart, size).replace(/\0+$/, '');
                    offset = nextOffset;
                    continue;
                }

                // Skip directories and special entries
                if (typeflag === '5' || typeflag === '1' || typeflag === '2' ||
                    typeflag === '3' || typeflag === '4' || typeflag === '6' ||
                    typeflag === 'g' || typeflag === 'x') {
                    pendingLongName = null;
                    offset = nextOffset;
                    continue;
                }

                let name;
                if (pendingLongName) {
                    name = pendingLongName;
                    pendingLongName = null;
                } else {
                    const rawName = readString(header, 0, 100);
                    const magic = readString(header, 257, 5);
                    const prefix = magic === 'ustar' ? readString(header, 345, 155) : '';
                    name = prefix ? prefix + '/' + rawName : rawName;
                }
                if (!name) break;

                if (typeflag === '0' || typeflag === '\0' || size > 0) {
                    const fileData = data.slice(dataStart, dataEnd);
                    files.push({ name, size: fileData.length, data: fileData });
                }

                offset = nextOffset;
            }

            return files;
        }
        
        function readString(data, offset, length) {
            let str = '';
            for (let i = 0; i < length; i++) {
                if (data[offset + i] === 0) break;
                str += String.fromCharCode(data[offset + i]);
            }
            return str;
        }
