<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Decrypt and explore UniFi .unf and .unifi backup files entirely in your browser — no upload, no server.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f1ea">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f1ea'/%3E%3Cpath d='M16 6l7 8h-4v12h-6V14H9z' fill='%235c6e44'/%3E%3C/svg%3E">
    <title>UniFi Backup Explorer</title>
    <script>
        (function () {
            var VALID_THEMES = ['paper', 'parchment', 'cream', 'ivory', 'kraft', 'charcoal', 'night'];
            var theme = localStorage.getItem('ube-theme');
            if (VALID_THEMES.indexOf(theme) === -1) {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --radius: 14px;
            --mono: 'IBM Plex Mono', ui-monospace, monospace;
            --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        }

        /*
           Paper-matte theme family.
           Base palette shared by every variation; each [data-theme="…"] block
           overrides the background/surface/accent hues so all components pick
           up the active variation automatically.
        */
        :root {
            color-scheme: light;
            --bg-1: #f4f1ea;
            --bg-2: #e8e2d5;
            --accent: #7a8b5f;
            --accent-strong: #5c6e44;
            --accent-soft: #ede9dc;
            --accent-muted: #e0dbc9;
            --surface: #faf8f2;
            --surface-2: #f0ecdf;
            --text: #2f2a20;
            --text-muted: #6e6653;
            --border: #d8d2c0;
            --shadow: 0 12px 40px rgba(87, 74, 44, 0.16);
            --panel-border: rgba(87, 74, 44, 0.18);
            --glow-1: rgba(122, 139, 95, 0.16);
            --glow-2: rgba(160, 140, 100, 0.12);
            --drop-drag: #e6e0cf;
            --code-bg: #eee9da;
            --error-bg: #f6e4e1;
            --error-border: #dcbdb6;
            --error-text: #8c3a2e;
            --badge-success-bg: #e3ead8;
            --badge-success-text: #4f6136;
            --badge-info-bg: #dde5e4;
            --badge-info-text: #3d5a5c;
            --badge-warning-bg: #f1e6cd;
            --badge-warning-text: #7a5b1e;
            --badge-muted-bg: #e7e2d3;
            --badge-muted-text: #6e6653;
            --btn-shadow: rgba(92, 110, 68, 0.25);
            --overlay-scrim: rgba(47, 42, 32, 0.45);
            --json-bg: #f5f2e9;
            --json-border: #dcd6c4;
            --json-text: #3d382c;
            --json-key: #1f5f8b;
            --json-string: #3d6b2f;
            --json-number: #a3541b;
            --json-boolean: #7b4ba5;
            --json-null: #8a8271;
            --json-punct: #7d7561;
            --prop-comment: #8a8271;
            --code-inset: rgba(255, 255, 255, 0.5);
        }

        /* Paper — classic warm-white matte stock (default) */
        [data-theme="paper"],
        [data-theme="parchment"],
        [data-theme="cream"],
        [data-theme="ivory"],
        [data-theme="kraft"],
        [data-theme="charcoal"],
        [data-theme="night"] {
            background: transparent;
        }

        [data-theme="parchment"] {
            --bg-1: #f0e7d3;
            --bg-2: #e2d4b8;
            --accent: #9c7c4a;
            --accent-strong: #7a5f36;
            --accent-soft: #e9dcc2;
            --accent-muted: #ddcbab;
            --surface: #f7f0de;
            --surface-2: #ece1c8;
            --text: #3a3020;
            --text-muted: #75664a;
            --border: #d6c6a5;
            --panel-border: rgba(90, 73, 40, 0.22);
            --glow-1: rgba(156, 124, 74, 0.18);
            --glow-2: rgba(184, 148, 92, 0.12);
            --drop-drag: #e4d6ba;
            --code-bg: #e9dec5;
            --badge-info-bg: #dfe4d9;
            --badge-info-text: #48573a;
            --json-bg: #f4ecd9;
            --json-border: #d9c9a9;
            --json-text: #3f3522;
            --json-key: #1e5c7a;
            --json-string: #47632a;
            --json-number: #a15c1c;
        }

        [data-theme="cream"] {
            --bg-1: #f6f0e2;
            --bg-2: #eadfc8;
            --accent: #b98a4e;
            --accent-strong: #8f6836;
            --accent-soft: #efe4cd;
            --accent-muted: #e5d6b9;
            --surface: #fbf6ea;
            --surface-2: #f1e9d6;
            --text: #35291a;
            --text-muted: #71624a;
            --border: #ded0b5;
            --panel-border: rgba(80, 61, 31, 0.2);
            --glow-1: rgba(185, 138, 78, 0.15);
            --glow-2: rgba(150, 170, 200, 0.14);
            --drop-drag: #ecdfc6;
            --code-bg: #eee3ca;
            --badge-info-bg: #dde6e8;
            --badge-info-text: #365b66;
            --json-bg: #f8f2e4;
            --json-border: #ddd0b2;
            --json-text: #3a2f1e;
            --json-key: #26607f;
            --json-string: #3f6b30;
            --json-number: #a4551d;
        }

        [data-theme="ivory"] {
            --bg-1: #f7f4ec;
            --bg-2: #ebe6d9;
            --accent: #6b7f8e;
            --accent-strong: #4d6272;
            --accent-soft: #eef0ec;
            --accent-muted: #e2e6e3;
            --surface: #fcfbf6;
            --surface-2: #f2f0e8;
            --text: #2c2e26;
            --text-muted: #686d60;
            --border: #dad6c9;
            --panel-border: rgba(60, 64, 54, 0.16);
            --glow-1: rgba(107, 127, 142, 0.16);
            --glow-2: rgba(150, 145, 120, 0.1);
            --drop-drag: #e9e7dc;
            --code-bg: #edeadf;
            --badge-success-bg: #e0e8d8;
            --badge-success-text: #44582e;
            --json-bg: #f7f5ee;
            --json-border: #dcd8ca;
            --json-text: #33352c;
            --json-key: #265d78;
            --json-string: #3c6b34;
            --json-number: #9c5518;
        }

        [data-theme="kraft"] {
            --bg-1: #e3d5b8;
            --bg-2: #d3c19c;
            --accent: #8a6f3e;
            --accent-strong: #6a5329;
            --accent-soft: #dcd0b1;
            --accent-muted: #d0c1a0;
            --surface: #ece0c6;
            --surface-2: #e0d2b2;
            --text: #3a2f1c;
            --text-muted: #6f6142;
            --border: #c7b591;
            --shadow: 0 12px 40px rgba(76, 61, 31, 0.22);
            --panel-border: rgba(76, 61, 31, 0.26);
            --glow-1: rgba(138, 111, 62, 0.2);
            --glow-2: rgba(170, 140, 90, 0.14);
            --drop-drag: #d8c8a4;
            --code-bg: #ded0af;
            --error-bg: #efdcd8;
            --error-border: #d4b3ac;
            --error-text: #7d3a2c;
            --badge-muted-bg: #ddd0b0;
            --badge-muted-text: #5f5136;
            --json-bg: #efe3c9;
            --json-border: #cbb890;
            --json-text: #3a2f1c;
            --json-key: #27506b;
            --json-string: #41612a;
            --json-number: #95501a;
            --json-punct: #6f6142;
        }

        [data-theme="charcoal"] {
            color-scheme: dark;
            --bg-1: #33322e;
            --bg-2: #232420;
            --accent: #a89c82;
            --accent-strong: #c4b896;
            --accent-soft: #3a3933;
            --accent-muted: #46453d;
            --surface: #2e2d29;
            --surface-2: #3a3833;
            --text: #e9e5d8;
            --text-muted: #a49d8b;
            --border: #4c4a42;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            --panel-border: rgba(233, 229, 216, 0.08);
            --glow-1: rgba(168, 156, 130, 0.12);
            --glow-2: rgba(120, 112, 90, 0.1);
            --drop-drag: #43423a;
            --code-bg: #403f37;
            --error-bg: #4a3230;
            --error-border: #6e4a45;
            --error-text: #f0c2ba;
            --badge-success-bg: #3d4636;
            --badge-success-text: #b9c9a4;
            --badge-info-bg: #354349;
            --badge-info-text: #a8c5cd;
            --badge-warning-bg: #4d4230;
            --badge-warning-text: #e6cf9d;
            --badge-muted-bg: #45443c;
            --badge-muted-text: #c9c3b2;
            --btn-shadow: rgba(196, 184, 150, 0.22);
            --overlay-scrim: rgba(20, 20, 18, 0.6);
            --json-bg: #26251f;
            --json-border: #43423a;
            --json-text: #ded9c8;
            --json-key: #9fc3e0;
            --json-string: #b5c99a;
            --json-number: #e0b070;
            --json-boolean: #c8aee0;
            --json-null: #a49d8b;
            --json-punct: #948d7a;
            --prop-comment: #8a8474;
            --code-inset: rgba(255, 255, 255, 0.03);
        }

        [data-theme="night"] {
            color-scheme: dark;
            --bg-1: #262a2e;
            --bg-2: #17191c;
            --accent: #8fa6b5;
            --accent-strong: #aec4d2;
            --accent-soft: #2c3338;
            --accent-muted: #37414a;
            --surface: #22262a;
            --surface-2: #2b3035;
            --text: #e6e9e3;
            --text-muted: #9aa39c;
            --border: #3c4348;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            --panel-border: rgba(230, 233, 227, 0.08);
            --glow-1: rgba(143, 166, 181, 0.14);
            --glow-2: rgba(90, 110, 125, 0.1);
            --drop-drag: #38424a;
            --code-bg: #31373d;
            --error-bg: #42302e;
            --error-border: #6b4a46;
            --error-text: #efc0b8;
            --badge-success-bg: #364434;
            --badge-success-text: #b0c6a8;
            --badge-info-bg: #323f48;
            --badge-info-text: #a4c2d4;
            --badge-warning-bg: #453c2c;
            --badge-warning-text: #e2cb96;
            --badge-muted-bg: #3a4046;
            --badge-muted-text: #c2c8c0;
            --btn-shadow: rgba(174, 196, 210, 0.22);
            --overlay-scrim: rgba(12, 14, 16, 0.6);
            --json-bg: #1c2023;
            --json-border: #3c4348;
            --json-text: #d9ddd4;
            --json-key: #9cc6e8;
            --json-string: #acc9a2;
            --json-number: #dcb472;
            --json-boolean: #c4abe4;
            --json-null: #9aa39c;
            --json-punct: #8b938c;
            --prop-comment: #7d857e;
            --code-inset: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--sans);
            background:
                radial-gradient(1200px 600px at 10% -10%, var(--glow-1), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, var(--glow-2), transparent 50%),
                linear-gradient(155deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 28px 20px 40px;
            color: var(--text);
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-family: var(--sans);
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .theme-popover {
            position: fixed;
            top: 64px;
            right: 16px;
            z-index: 60;
            background: var(--surface);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 10px;
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            width: 264px;
        }

        .theme-popover.open {
            display: grid;
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 0.82rem;
            cursor: pointer;
            text-align: left;
        }

        .theme-option:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .theme-option.active {
            border-color: var(--accent-strong);
            background: var(--accent-soft);
            font-weight: 600;
        }

        .theme-swatch {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 1px solid var(--panel-border);
            flex-shrink: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: var(--text);
            margin-bottom: 28px;
        }
        
        .header h1 {
            font-size: clamp(1.85rem, 4vw, 2.45rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 1.05rem;
            opacity: 0.88;
            font-weight: 400;
            max-width: 36em;
            margin: 0 auto;
            line-height: 1.45;
        }
        
        .upload-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 36px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            position: relative;
            border: 1px solid var(--panel-border);
        }
        
        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 56px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
            background: var(--accent-soft);
            position: relative;
            z-index: 1;
        }
        
        .drop-zone:hover {
            border-color: var(--accent-strong);
            background: var(--accent-muted);
        }
        
        .drop-zone.drag-over {
            border-color: var(--accent-strong);
            background: var(--drop-drag);
            transform: scale(1.01);
        }
        
        .drop-zone svg {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            color: var(--accent);
        }
        
        .drop-zone p {
            font-size: 1.15rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .drop-zone span {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .file-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }
        
        .info-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            display: none;
            border: 1px solid var(--panel-border);
        }
        
        .info-section.visible {
            display: block;
        }
        
        .file-info {
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .file-info h2 {
            color: var(--accent-strong);
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 600;
            word-break: break-word;
            line-height: 1.35;
        }

        .file-info h2 svg {
            flex-shrink: 0;
            margin-top: 2px;
        }

        .file-info h2 .backup-filename {
            min-width: 0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .info-item {
            background: var(--surface-2);
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .info-item label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .info-item label svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.9;
        }
        
        .info-item value {
            font-size: 0.98rem;
            color: var(--text);
            font-weight: 500;
            display: block;
            line-height: 1.35;
            word-break: break-word;
        }
        
        .info-item.download-item {
            grid-column: 1 / -1;
            border-left: none;
            background: transparent;
            padding: 4px 0 0;
            min-height: 0;
        }

        .download-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .download-actions .reset-btn {
            margin-top: 0;
            flex: 1 1 220px;
        }
        
        .data-section {
            margin-top: 8px;
        }
        
        .data-section h3 {
            color: var(--accent-strong);
            margin-bottom: 14px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .tip {
            margin-top: 18px;
            font-size: 0.88rem;
            color: var(--text-muted);
            background: var(--surface-2);
            border-radius: 8px;
            padding: 12px 14px;
            line-height: 1.45;
        }

        .tip code {
            font-family: var(--mono);
            font-size: 0.85em;
            background: var(--code-bg);
            padding: 1px 5px;
            border-radius: 4px;
        }
        
        .json-viewer {
            background: var(--json-bg);
            border: 1px solid var(--json-border);
            border-radius: 10px;
            padding: 18px 20px;
            max-height: min(60vh, 520px);
            overflow: auto;
            font-family: var(--mono);
            font-size: 0.84rem;
            line-height: 1.55;
            color: var(--json-text);
            box-shadow: inset 0 1px 0 var(--code-inset);
        }
        
        .json-viewer pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .bson-browser {
            display: grid;
            grid-template-columns: minmax(200px, 300px) 1fr;
            gap: 14px;
            min-height: min(72vh, 780px);
        }

        .bson-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .bson-filter {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 0.88rem;
        }

        .bson-filter:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .bson-collections {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            max-height: min(70vh, 720px);
            flex: 1;
        }

        .bson-collections li button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            text-align: left;
            padding: 10px 12px;
            cursor: pointer;
            font-family: var(--sans);
            font-size: 0.86rem;
        }

        .bson-collections li:last-child button {
            border-bottom: 0;
        }

        .bson-collections li button:hover {
            background: var(--accent-muted);
        }

        .bson-collections li button.active {
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-weight: 600;
        }

        .bson-collections .coll-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bson-collections .coll-count {
            flex-shrink: 0;
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .bson-main {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            min-height: 0;
        }

        .bson-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.86rem;
        }

        .bson-toolbar .bson-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bson-toolbar button {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 10px;
            font-family: var(--sans);
            font-size: 0.82rem;
            cursor: pointer;
        }

        .bson-toolbar button:hover:not(:disabled) {
            background: var(--accent-muted);
        }

        .bson-toolbar button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .bson-browser .json-viewer {
            flex: 1;
            max-height: min(70vh, 720px);
        }

        @media (max-width: 720px) {
            .info-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .bson-browser {
                grid-template-columns: 1fr;
            }

            .bson-collections {
                max-height: 180px;
            }
        }

        @media (max-width: 420px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .json-viewer .json-key { color: var(--json-key); }
        .json-viewer .json-string { color: var(--json-string); }
        .json-viewer .json-number { color: var(--json-number); }
        .json-viewer .json-boolean { color: var(--json-boolean); }
        .json-viewer .json-null { color: var(--json-null); font-style: italic; }
        .json-viewer .json-punctuation { color: var(--json-punct); }
        .json-viewer .prop-comment { color: var(--prop-comment); font-style: italic; }
        
        .error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            padding: 18px 20px;
            color: var(--error-text);
            margin-top: 16px;
        }

        .error-detail {
            margin-top: 8px;
            color: var(--error-text);
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 48px 24px;
            color: var(--accent-strong);
        }
        
        .spinner {
            border: 3px solid var(--accent-muted);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 0.85s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        .reset-btn {
            background: var(--accent);
            color: var(--surface);
            border: 1px solid transparent;

            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;

            align-items: center;
            justify-content: center;
            gap: 8px;

            width: 18px;
            height: 18px;
            flex-shrink: 0;

        .reset-btn:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);

        .reset-btn.btn-block {
            width: 100%;
            margin-top: 0;
        }

        .reset-btn.btn-secondary {
            background: transparent;
            color: var(--accent-strong);
            border-color: var(--accent);

        }

        .reset-btn.btn-secondary:hover {
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            color: var(--accent-strong);
            box-shadow: none;

        .file-filter {
            margin: 4px 0 12px;

        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .collection-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .collection-table th,
        .collection-table td {
            padding: 11px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .collection-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .collection-table th {
            background: var(--surface-2);
            color: var(--accent-strong);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .collection-table td:first-child {
            font-family: var(--mono);
            font-size: 0.86rem;
            font-weight: 500;
        }

        .collection-table td:nth-child(2) {
            color: var(--text-muted);
            white-space: nowrap;
            width: 1%;
        }

        .collection-table td:nth-child(3) {
            width: 1%;
            white-space: nowrap;
        }
        
        .collection-table tbody tr {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .collection-table tbody tr:hover {
            background: var(--accent-soft);
        }
        
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            font-family: var(--mono);

        .badge-success {

        .badge-info {

        }
        
        .badge-warning {
            background: var(--badge-warning-bg);
            color: var(--badge-warning-text);
        }

        .badge-muted {

            color: var(--badge-muted-text);

        .page-drop-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--overlay-scrim);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        body.page-drag-over .page-drop-overlay {
            display: flex;
        }

        .page-drop-overlay-inner {
            border: 2px dashed var(--accent-strong);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            padding: 36px 44px;
            text-align: center;
            box-shadow: var(--shadow);
            max-width: 420px;
        }

        .page-drop-overlay-inner p {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .page-drop-overlay-inner span {
            display: block;
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-scrim);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-panel {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 920px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);

        .modal-panel.modal-panel-wide {
            max-width: min(1480px, 98vw);
            max-height: 96vh;
        }

        .modal-panel h2 {
            color: var(--accent-strong);
            margin-bottom: 16px;
            font-size: 1.1rem;

            font-size: 0.82rem;
            font-weight: 400;
            margin-left: 6px;

        .modal-panel .reset-btn {

        .modal-panel img {
            max-width: 100%;
            max-height: 70vh;
            margin-bottom: 16px;
